name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: pnpm

      - name: Enforce Node security floor
        run: node scripts/check-node-floor.mjs

      - name: Enforce pnpm security floor
        run: node scripts/check-pnpm-floor.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Build packages
        run: pnpm build

      - name: Type check
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Generate schemas
        run: pnpm schemas

      - name: Check schema sync
        run: |
          if ! git diff --exit-code schemas/; then
            echo "Generated schemas differ from committed versions"
            echo "Run 'pnpm schemas' and commit the changes"
            exit 1
          fi

      - name: CLI smoke test
        run: |
          node packages/cli/dist/index.js --version
          node packages/cli/dist/index.js --help
