packages:
  - "packages/*"
  - "action"

allowBuilds:
  esbuild: true

# pnpm 12 delays new releases by a day. Security floors have to install the day
# they publish, and this repo does not keep an exact-version exception list.
minimumReleaseAge: 0

# Minimum floors for transitive advisories. Caret ranges, not exact pins.
overrides:
  "esbuild": "^0.28.2"
  "http-cache-semantics": "^4.3.0"
  "ip-address": "^10.7.4"
  "minimatch": "^10.2.6"
  "nanoid@^3": "^3.3.20"
  "path-to-regexp@^8": "^8.4.2"
  "picomatch@^4": "^4.0.7"
  "postcss": "^8.5.31"
  "rollup": "^4.65.0"
  "source-map-js": "^1.2.2"
  "undici": "^6.29.1"
  "vite": "^8.3.5"
